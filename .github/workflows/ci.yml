name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest numpy
      - run: python -m pytest -q
      - run: python experiments/cheapest_probe.py
      - run: python experiments/calibrated_worlds.py
      - run: python -m experiments.precision_frontier
      - run: python -m experiments.pattern_cloud_stress
      - run: python -m experiments.exact_cheapest_experiment
      - run: python -m experiments.robust_cheapest_experiment
